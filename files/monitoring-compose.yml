services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  deco-rate:
    build: ./deco-rate-src
    image: deco-rate:local
    container_name: deco-rate
    restart: unless-stopped
    volumes:
      - ${SECRETS_DIR}/deco-rate.yaml:/etc/deco-rate/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  prometheus-data:

networks:
  default:
    name: homelab
    external: true
