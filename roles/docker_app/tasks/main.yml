---
- name: "{{ app_name }}: create directory"
  ansible.builtin.file:
    path: "{{ app_dir }}/{{ app_name }}"
    state: directory
    mode: '0755'

- name: "{{ app_name }}: copy Compose file"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/{{ app_name }}-compose.yml"
    dest: "{{ app_dir }}/{{ app_name }}/docker-compose.yml"
    mode: '0644'

- name: "{{ app_name }}: copy config"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/{{ app_config_src }}"
    dest: "{{ app_dir }}/{{ app_name }}/config/"
    mode: '0644'
  when: app_config_src | length > 0

- name: "{{ app_name }}: start stack"
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}/{{ app_name }}"
    state: present
