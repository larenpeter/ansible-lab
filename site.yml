---
- name: Deploy Homelab Infrastructure
  hosts: local
  gather_facts: yes

  vars:
    app_dir: "{{ ansible_facts.env.HOME }}/ansible-lab/deployed-apps"

  tasks:
    - name: Install Docker and Compose
      become: true
      apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true

    - name: Install VirtualBox guest utilities (shared folders)
      become: true
      apt:
        name: virtualbox-guest-utils
        state: present
      when: ansible_facts['virtualization_type'] | default('') == 'virtualbox'

    - name: Ensure Docker service is active
      become: true
      service:
        name: docker
        state: started
        enabled: yes

    - name: Look up the vboxsf group id
      ansible.builtin.command: getent group vboxsf
      register: vboxsf_group
      changed_when: false
      failed_when: false

    - name: Deploy apps
      ansible.builtin.include_role:
        name: docker_app
      vars:
        app_name: "{{ item.name }}"
        app_config_src: "{{ item.config | default('') }}"
        app_env: "{{ item.env | default('') }}"
      loop:
        - { name: homepage, config: "homepage/config/" }
        # - { name: navidrome }   # parked, add back to start it
        - { name: asterisk, config: "asterisk/config/" }
        - { name: minidlna, env: "VBOX_GID={{ vboxsf_group.stdout.split(':')[2] if vboxsf_group.rc == 0 else '0' }}" }
