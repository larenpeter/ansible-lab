---
- name: Deploy Homelab Infrastructure
  hosts: local
  gather_facts: yes

  vars:
    app_dir: "{{ ansible_facts.env.HOME }}/ansible-lab/deployed-apps"

  tasks:
    - name: Install Docker and Compose
      become: true
      apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true

    - name: Ensure Docker service is active
      become: true
      service:
        name: docker
        state: started
        enabled: yes

    - name: Deploy apps
      ansible.builtin.include_role:
        name: docker_app
      vars:
        app_name: "{{ item.name }}"
        app_config_src: "{{ item.config | default('') }}"
      loop:
        - { name: uptime-kuma }
        - { name: homepage, config: "homepage/config/" }
        - { name: navidrome }
