---
- name: My first playbook
  hosts: localhost
  tasks:
    - name: Say hello
      ansible.builtin.debug:
        msg: "Hello from Ansible on {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"

    - name: Make a practice folder
      ansible.builtin.file:
        path: ~/ansible-hello
        state: directory
        mode: "0755"
